name: DevSecOps Pipeline

on:
  push:
  pull_request:

# Prinsip least privilege: workflow hanya boleh membaca repo dan menulis issue
permissions:
  contents: read
  issues: write # <-- IZIN WRITE DITAMBAHKAN DI SINI

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  SEMGREP_VERSION: "1.177.0"

jobs:
  # ------------------------------------------------------------
  # CI dasar: install -> unit test
  # ------------------------------------------------------------
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PAYMENT_GATEWAY_API_KEY: ${{ secrets.PAYMENT_GATEWAY_API_KEY }}

  # ------------------------------------------------------------
  # TAHAP A: Secret Scan (Gitleaks)
  # ------------------------------------------------------------
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan secret di source code
        run: gitleaks dir . --redact --verbose

  # ------------------------------------------------------------
  # TAHAP B: Dependency Scan (npm audit)
  # ------------------------------------------------------------
  dependency-scan:
    name: Dependency Scan (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - run: npm audit --audit-level=high

  # ------------------------------------------------------------
  # TAHAP C: SAST (Semgrep)
  # ------------------------------------------------------------
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet "semgrep==${SEMGREP_VERSION}"
          echo "$RUNNER_TEMP/semgrep-venv/bin" >> "$GITHUB_PATH"
      - name: Jalankan SAST
        run: semgrep scan --config .semgrep/ --metrics=off --disable-version-check --error src

  # ------------------------------------------------------------
  # TAHAP E: DAST (OWASP ZAP)
  # ------------------------------------------------------------
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Jalankan server aplikasi (Background)
        run: |
          npm start & 
          sleep 10 
        env:
          JWT_SECRET: "dummy_secret_untuk_testing"
          PAYMENT_GATEWAY_API_KEY: "dummy_api_key_untuk_testing"
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          fail_action: false 

  # ------------------------------------------------------------
  # TAHAP D: Security Gate (Deploy)
  # ------------------------------------------------------------
  deploy:
    name: Deploy ke Staging (simulasi)
    needs: [build-test, secret-scan, dependency-scan, sast, dast]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Semua security gate lolos. Deploy ke staging (simulasi)."